<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit movie</title>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">CineGallery</a>
        <div class="d-flex align-items-center">
          <span class="navbar-text me-3" id="account-name" hidden></span>
          <button class="btn btn-outline-light btn-sm" id="sign-in" type="button" hidden>Sign in</button>
          <button class="btn btn-outline-light btn-sm" id="sign-out" type="button" hidden>Sign out</button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <h1 class="h3">Edit movie</h1>
      <p id="status" class="text-secondary" hidden>Checking access…</p>
      <div id="form-alert" class="alert alert-danger" role="alert" hidden></div>
      <div id="forbidden" class="alert alert-warning" role="alert" hidden>
        You are signed in, but this account does not have the Movies.Write scope.
      </div>
      <a id="back" href="index.html" hidden>Back to movies</a>
      <form id="movie-form" class="mt-3" style="max-width: 32rem" hidden>
        <div class="mb-3">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" name="name" maxlength="256" required />
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-link" href="index.html">Cancel</a>
      </form>
    </main>
    <script type="module" src="/src/pages/edit.js"></script>
  </body>
</html>
